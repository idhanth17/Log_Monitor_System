<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Login — SecureLog</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050712;
            --bg-card: rgba(13, 17, 34, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-violet: #8b5cf6;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(52, 211, 153, 0.08) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }

        .container { display: flex; gap: 2rem; width: 100%; max-width: 1000px; padding: 2rem; }
        .card { flex: 1; background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 28px; padding: 3rem; backdrop-filter: blur(25px); transition: 0.3s; }
        .card:hover { border-color: rgba(139,92,246,0.3); }

        h2 { font-size: 2rem; letter-spacing: -1px; margin-bottom: 0.5rem; color: #fff; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2.5rem; }

        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.6rem; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); color: #fff; padding: 0.9rem 1.2rem; border-radius: 14px; outline: none; font-size: 1rem; transition: 0.2s; }
        input:focus { border-color: var(--accent-violet); background: rgba(255,255,255,0.08); }

        .btn { width: 100%; padding: 1rem; border: none; border-radius: 14px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: 0.2s; margin-top: 1rem; color: #fff; }
        .btn-user { background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139,92,246,0.3); }
        .btn-user:hover { background: rgba(139, 92, 246, 0.2); }
        .btn-admin { background: linear-gradient(135deg, #5b21b6, #8b5cf6); box-shadow: 0 4px 20px rgba(139,92,246,0.3); }

        .shortcuts { margin-top: 2rem; display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .chip { padding: 0.4rem 1rem; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); font-size: 0.8rem; cursor: pointer; color: var(--text-muted); }
        .chip:hover { background: rgba(255,255,255,0.1); color: #fff; }

        #error { position: fixed; bottom: 2rem; background: #ef4444; color: #fff; padding: 1rem 2rem; border-radius: 12px; transform: translateY(100px); transition: 0.3s; opacity: 0; }
        #error.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>User Login</h2>
            <p class="subtitle">Access compute nodes and services.</p>
            <div class="form-group">
                <label>Identifier</label>
                <input type="text" id="u-name" placeholder="Alice, Bob...">
            </div>
            <button class="btn btn-user" onclick="login('user')">Connect to Terminal</button>
            <div class="shortcuts">
                <span class="chip" onclick="document.getElementById('u-name').value='Alice'">Alice</span>
                <span class="chip" onclick="document.getElementById('u-name').value='Bob'">Bob</span>
                <span class="chip" onclick="document.getElementById('u-name').value='Charlie'">Charlie</span>
            </div>
        </div>

        <div class="card">
            <h2>Authorized Access</h2>
            <p class="subtitle">Management console for infrastructure.</p>
            <div class="form-group">
                <label>Secure Credential</label>
                <input type="password" id="a-pass" placeholder="••••••••">
            </div>
            <button class="btn btn-admin" onclick="login('admin')">Admin Authentication</button>
        </div>
    </div>
    <div id="error"></div>

    <script>
        async function login(role) {
            const name = role === 'admin' ? 'admin' : document.getElementById('u-name').value;
            const password = role === 'admin' ? document.getElementById('a-pass').value : null;

            if (role === 'user' && !name) return err("Enter name");
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, password })
                });
                const data = await res.json();
                if (!res.ok) return err(data.detail || "Failed");

                localStorage.setItem('auth_token', data.token);
                localStorage.setItem('auth_name', data.name);
                localStorage.setItem('auth_role', data.role);
                window.location.href = role === 'admin' ? '/admin.html' : '/index.html';
            } catch(e) { err("Server disconnected"); }
        }
        function err(m) { const e=document.getElementById('error'); e.innerText=m; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),3000); }
    </script>
</body>
</html>
